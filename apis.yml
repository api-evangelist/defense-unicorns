aid: defense-unicorns
name: Defense Unicorns
description: >-
  Defense Unicorns is a defense-technology company that makes running modern software on
  military systems easy — from cloud to edge, satellites to submarines. Its UDS (Unicorn
  Delivery Service) platform is a secure-by-default, airgap-native software delivery stack
  built on Kubernetes and Zarf, bundling Istio, Keycloak, Authservice, Prometheus/Grafana,
  Vector/Loki, Falco and the Pepr policy engine. The company ships its developer surface as
  open-source CLIs and libraries — the UDS CLI, Pepr, Lula (compliance-as-code / OSCAL),
  and the Maru task runner — rather than a hosted REST API. Offerings span UDS Core, UDS
  Fleet, UDS Enterprise, software factories, compliance automation, and forward-deployed
  engineering. Backed by Sapphire Ventures.
